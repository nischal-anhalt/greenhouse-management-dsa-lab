services:
  mongodb:
    image: mongo:8.2.7
    ports:
      - "27018:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mongosh --quiet --eval 'db.adminCommand({ ping: 1 }).ok' | grep 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  grpc-service:
    build:
      context: ./grpc-simple-service-lab-2
    environment:
      SERVICE_NAME: greenhouse-grpc-service
      GRPC_PORT: "50051"
      MONGO_URI: mongodb://mongodb:27017
      MONGO_DB: itemsdb
      MONGO_COLLECTION: items
      METRICS_PORT: "9103"
    ports:
      - "50052:50051"
      - "9103:9103"
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import socket; s=socket.create_connection(('localhost', 50051), 2); s.close()",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  rest-service:
    build:
      context: ./greenhouse-service-lab-1
    environment:
      SERVICE_NAME: greenhouse-rest-service
      PORT: "5000"
      GRPC_TARGET: grpc-service:50051
    ports:
      - "8085:5000"
    depends_on:
      grpc-service:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:5000/health', timeout=2).read()",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  prometheus:
    image: prom/prometheus:v3.11.2
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
    ports:
      - "9090:9090"
    depends_on:
      - rest-service
      - grpc-service

  grafana:
    image: grafana/grafana-oss:13.0.1
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: dsa
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
  
  loki:
    image: grafana/loki:3.0.0
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml

  promtail:
    image: grafana/promtail:3.0.0
    volumes:
      - ./observability/promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki

  gateway:
    image: traefik:v3.6.14
    command:
      - "--entryPoints.websecure.address=:443"
      - "--providers.file.filename=/etc/traefik/dynamic.yml"
      - "--accesslog=true"
      - "--log.level=INFO"
      - "--api.dashboard=true"
      - "--api.insecure=true"
    ports:
      - "8443:443"
      - "8090:8080"
    volumes:
      - ./security/traefik/dynamic.yml:/etc/traefik/dynamic.yml:ro
      - ./security/certs:/certs:ro
    depends_on:
      - rest-service

volumes:
  mongo-data:
  grafana-data:

